# Example site for the nginx reverse proxy on the VM (not the container).
# Copy to /etc/nginx/sites-available/ov-planner, set server_name, then:
#   sudo ln -s /etc/nginx/sites-available/ov-planner /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ov.example.nl
#   sudo nginx -t && sudo systemctl reload nginx
# certbot adds the HTTPS server block and the HTTP -> HTTPS redirect.
# HTTPS is required: the login cookie is only sent over HTTPS in production.

server {
  listen 80;
  listen [::]:80;
  server_name ov.example.nl;

  location / {
    # compose.yaml publishes the web container on 127.0.0.1:8080 only.
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
