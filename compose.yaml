# Local build. For the server, see deploy/compose.prod.yaml (pulls from the
# registry) and deploy/push-images.sh (builds and pushes the images).
name: jelph-ov-planner

services:
  api:
    image: ${IMAGE_REGISTRY:-local}/ov-planner-api:${IMAGE_TAG:-latest}
    container_name: jelph-ov-api
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    image: ${IMAGE_REGISTRY:-local}/ov-planner-web:${IMAGE_TAG:-latest}
    container_name: jelph-ov-web
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      # Localhost only: the host's nginx (HTTPS) proxies to this port.
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
